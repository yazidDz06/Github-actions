name: setup app
description: install node, restore the npm cache and install dependencies

inputs:
  node-version:
    description: node version to install
    required: false
    default: "20"
  working-directory:
    description: folder containing package.json
    required: false
    default: react-app/my-app

outputs:
  cache-hit:
    description: "true if node_modules were restored from cache"
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: setup node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: cache npm modules
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          ${{ inputs.working-directory }}/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-node-

    # run steps in a composite action must declare their shell
    - name: install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
