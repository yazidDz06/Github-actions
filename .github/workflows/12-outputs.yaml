name: workflow outputs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 2) le job expose ses propres outputs, alimentés par ceux des steps
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_time: ${{ steps.meta.outputs.build_time }}
    steps:
      # 1) un step écrit ses outputs dans le fichier $GITHUB_OUTPUT
      - name: compute metadata
        id: meta
        run: |
          echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # un step du meme job lit l'output via steps.<id>.outputs.<name>
      - name: use step output in same job
        run: echo "building version ${{ steps.meta.outputs.version }}"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 3) un autre job lit les outputs via needs.<job>.outputs.<name>
      - name: use job outputs from another job
        run: |
          echo "deploying version ${{ needs.build.outputs.version }}"
          echo "built at ${{ needs.build.outputs.build_time }}"
