name: workflow expressions

on: push

jobs:
  expressions:
    runs-on: ubuntu-latest
    steps:
      # an expression is anything inside ${{ }}, evaluated by GitHub before the step runs
      - name: operators
        run: |
          echo "${{ 'abc' == 'ABC' }}"                                # comparisons are case-insensitive -> true
          echo "${{ github.ref_name == 'main' && 'prod' || 'dev' }}"  # ternary trick: condition && valueIfTrue || valueIfFalse
          echo "${{ !startsWith(github.ref, 'refs/tags/') }}"         # ! negates, true when the run does not come from a tag

      # built-in functions: contains, startsWith, endsWith, format, join, toJSON, hashFiles...
      - name: functions
        run: |
          echo "${{ contains(github.event.head_commit.message, 'fix') }}"          # true if the commit message contains 'fix'
          echo "${{ format('run #{0} by {1}', github.run_number, github.actor) }}"  # string formatting with {0} {1} placeholders

      # `if:` is already an expression, so the ${{ }} are optional there
      - name: only on main
        if: github.ref_name == 'main'
        run: echo "we are on main"

      # ${{ }} still work in `if:` if you prefer to be explicit
      - name: only when the commit message contains 'docs'
        if: ${{ contains(github.event.head_commit.message, 'docs') }}
        run: echo "docs commit"

  status-functions:
    runs-on: ubuntu-latest
    needs: expressions
    # job-level `if:` decides if the whole job runs, here only when the previous job succeeded
    if: needs.expressions.result == 'success'
    steps:
      - name: a step that fails
        run: exit 1

      # status functions check the result of the previous steps of the job
      - name: runs only if a previous step failed
        if: failure()
        run: echo "something failed before me"

      # always() runs even after a failure or a cancel, perfect for cleanup / notifications
      - name: runs no matter what
        if: always()
        run: echo "always executed"

      # success() is the implicit default when a step has no `if:` at all
      - name: runs only if nothing failed
        if: success()
        run: echo "skipped here because a step failed"
