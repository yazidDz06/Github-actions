name: concurrency

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# one run per branch: pushing again on the same branch cancels the run still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # checkout first: the local action is read from the repo
      - name: checkout
        uses: actions/checkout@v4

      - name: setup app
        id: setup
        uses: ./.github/actions/setup-app
        with:
          node-version: 20

      - name: show composite action output
        run: 'echo "cache hit: ${{ steps.setup.outputs.cache-hit }}"'

      - name: run tests
        working-directory: react-app/my-app
        run: npm test -- --watchAll=false

      - name: build
        working-directory: react-app/my-app
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    # never two deploys at once, and never cancel one halfway through
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: deploy
        run: echo "deploying ${{ github.sha }}"
